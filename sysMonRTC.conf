sysType=AMD

diskNames=/dev/sda,/dev/sdb,/dev/sdc,/dev/sdd,/dev/sde,/dev/sdf,/dev/sdg,/dev/sdh
warningCoreTemp=90
criticalCoreTemp=99
warningDiskTemp=60
criticalDiskTemp=60


[gpu]
enabled=true
interval=5
timeout=2
expectedUUIDs=GPU-10b675e2-c289-9301-d3c9-fcb06d210d4b,GPU-a3ec9501-15f5-fc2f-5d5d-6b31512bd91b

[irq]
interval=5

[irq.camwfs]
match=edt
cpuset=camwfs_irq

[irq.woofer]
match=cp2x72c
cpuset=woofer

[irq.shmimTCP]
match=enx98b78501aebc
cpuset=shmimTCP
