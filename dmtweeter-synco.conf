[production]
enabled=true
readyLeadUs=70
step0LeadUs=20

[simulation]
enabled=false

[zeroTest]
enabled=false

[shmimMonitor]
cpuset=dmtweeter-synco
shmimName=dm01disp03

[streams]
destinations=dm01disp07,dm01disp08,dm01disp09,dm01disp10
timing=dmtweeter_synco_timing

[scheduler]
maxSubframes=4
maxCadenceHz=8000

[completionMonitor]
shmimName=dmtweeter_done


[readerReleaseMonitor]
shmimName=dmtweeter_read_done
threadPrio=30
cpuset=spare57
