[production]
enabled=true
readyLeadUs=70
step0LeadUs=20

[simulation]
enabled=false

[zeroTest]
enabled=false

[shmimMonitor]
cpuset=dmtweeter-synco
shmimName=dm01disp03

[streams]
destinations=dm01disp04,dm01disp05,dm01disp06,dm01disp07,dm01disp08
timing=dmtweeter_synco_timing

[scheduler]
maxSubframes=4
maxCadenceHz=8000
copyBudgetUs=30

[completionMonitor]
shmimName=dmtweeter_done


[readerReleaseMonitor]
shmimName=dmtweeter_read_done
threadPrio=30
cpuset=dmtweeter-synco-release

[diagnostics]
mainTimingStream=dmtweeter_synco_main_timing
mainTimingCapacity=32768
