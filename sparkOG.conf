[calib]
root = /opt/MagAOX/calib/spark-PCA

[pca]
# Number of recent frames in rolling buffer
bufferN = 2000
# Minimum frames before computing metrics (app enforces at least 10*klipMax)
minSamples = 100
# Max PCA modes to publish/use
klipMax = 3

[wfsimShmim]
# Shared-memory monitor settings
threadPrio = 0
shmimName = aol1_imWFS2
getExistingFirst = true
