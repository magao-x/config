[camwfs-frame-delay-atime-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=atime
target=On

[camwfs-frame-delay-atime-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=atime
target=On

[camwfs-frame-delay-atime]
ruleType=ruleComp
rule1=camwfs-frame-delay-atime-enabled
rule2=camwfs-frame-delay-atime-latched
comp=And
priority=warning
message="camwfs DMA completion interval is late"

[camwfs-frame-delay-arrival-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=arrival
target=On

[camwfs-frame-delay-arrival-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=arrival
target=On

[camwfs-frame-delay-arrival]
ruleType=ruleComp
rule1=camwfs-frame-delay-arrival-enabled
rule2=camwfs-frame-delay-arrival-latched
comp=And
priority=warning
message="camwfs SDK return interval is late"

[camwfs-frame-delay-write-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=write
target=On

[camwfs-frame-delay-write-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=write
target=On

[camwfs-frame-delay-write]
ruleType=ruleComp
rule1=camwfs-frame-delay-write-enabled
rule2=camwfs-frame-delay-write-latched
comp=And
priority=warning
message="camwfs stream write interval is late"

[camwfs-frame-delay-atime-sum-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=atime_sum
target=On

[camwfs-frame-delay-atime-sum-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=atime_sum
target=On

[camwfs-frame-delay-atime-sum]
ruleType=ruleComp
rule1=camwfs-frame-delay-atime-sum-enabled
rule2=camwfs-frame-delay-atime-sum-latched
comp=And
priority=warning
message="camwfs DMA completion cadence is late"

[camwfs-frame-delay-arrival-sum-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=arrival_sum
target=On

[camwfs-frame-delay-arrival-sum-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=arrival_sum
target=On

[camwfs-frame-delay-arrival-sum]
ruleType=ruleComp
rule1=camwfs-frame-delay-arrival-sum-enabled
rule2=camwfs-frame-delay-arrival-sum-latched
comp=And
priority=warning
message="camwfs SDK return cadence is late"

[camwfs-frame-delay-write-sum-enabled]
ruleType=swVal
property=camwfs.frame_delay_enable
element=write_sum
target=On

[camwfs-frame-delay-write-sum-latched]
ruleType=swVal
property=camwfs.frame_delay_warning
element=write_sum
target=On

[camwfs-frame-delay-write-sum]
ruleType=ruleComp
rule1=camwfs-frame-delay-write-sum-enabled
rule2=camwfs-frame-delay-write-sum-latched
comp=And
priority=warning
message="camwfs stream write cadence is late"

