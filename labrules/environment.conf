element=upper
target=30

[temprack-upper-warning]
ruleType=numVal
priority=warning
comp=GtEq
property=temprack.temperature
element=upper
target=32

[temprack-upper-alert]
ruleType=numVal
priority=alert
comp=GtEq
property=temprack.temperature
element=upper
target=35

[temprack-lower-caution]
ruleType=numVal
priority=caution
comp=GtEq
property=temprack.temperature
element=lower
target=28

[temprack-lower-warning]
ruleType=numVal
priority=warning
comp=GtEq
property=temprack.temperature
element=lower
target=30

[temprack-lower-alert]
ruleType=numVal
priority=alert
comp=GtEq
property=temprack.temperature
