### Monitor instCool ###
[instCool-flow-caution]
ruleType=numVal
priority=caution
comp=LtEq
property=instCool.status
element=flow_rate
target=2.0

[instCool-flow-warning]
ruleType=numVal
priority=warning
comp=LtEq
