##################################
# environment rules

### These rules monitor tweeter humidity ###
#This rules tests if dmtweeter is powered-on
[dmtweeter-power-on]
ruleType=txtVal
property=pdu1.dmtweeter
element=state
target=On

#This rule tests if rhtweeter is not operating
[rhtweeter-not-operating]
ruleType=txtVal
property=rhtweeter.fsm
element=state
comp=Neq
target=OPERATING

#This rule test if rhtweeter humidity is above 12%
[rhtweeter-caution-pt]
ruleType=numVal
priority=caution
comp=GtEq
property=rhtweeter.humidity
element=current
target=12

#This rule test if rhtweeter humidity is above 15%
[rhtweeter-warning-pt]
ruleType=numVal
comp=GtEq
property=rhtweeter.humidity
element=current
target=15

#This rule test if rhtweeter humidity is above 18%
[rhtweeter-alert-pt]
ruleType=numVal
comp=GtEq
property=rhtweeter.humidity
element=current
target=18

#This rule test if rhtweeter humidity is above 12% and dmtweeter power is on
[rhtweeter-caution]
ruleType=ruleComp
priority=caution
message="tweeter humidity is above 12%"
comp=And
rule1=rhtweeter-caution-pt
rule2=dmtweeter-power-on

#This rule test if rhtweeter humidity is above 15% and dmtweeter power is on
[rhtweeter-warning]
ruleType=ruleComp
priority=warning
message="tweeter humidity is above 15%"
comp=And
rule1=rhtweeter-warning-pt
rule2=dmtweeter-power-on

#This rule test if rhtweeter humidity is above 18% and dmtweeter power is on
[rhtweeter-alert]
ruleType=ruleComp
priority=alert
message="tweeter humidity is above 18%"
comp=And
rule1=rhtweeter-alert-pt
rule2=dmtweeter-power-on

#This rule tests if dmtweeter is on and rhtweeter not operating
[rhtweeter-not-monitored]
priority=alert
message="dmtweeter is on but rhtweeter is not operating"
ruleType=ruleComp
comp=And
rule1=dmtweeter-power-on
rule2=rhtweeter-not-operating

