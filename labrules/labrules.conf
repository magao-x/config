#This rule tests if fwfpm is in the lytosm position
[fwfpm-lyotsm]
ruleType=swVal
priority=none #means don't publish, is the default and can be left out
comp=Eq #the default, can be left out
property=fwfpm.filterName #specifies device.property-name
element=lyotsm #specifies the element within property
target=On #the value to compare to

#This rule tests if fwfpm is in state READY
[fwfpm-READY]
ruleType=txtVal
property=fwfpm.fsm
element=state
target=READY

#This tests if fwfpm is in fpm in state READY (not moving)
[fwfpm-lyotsm-READY]
ruleType=ruleComp
comp=And
rule1=fwfpm-READY
rule2=fwfpm-lyotsm

#this rule tests if the presets for stagesci1 and fwfpm are both on
[fwfpm-lyotsm-stagesci1-fpm-neq]
ruleType=elCompSw
property1=fwfpm.filterName
element1=lyotsm
property2=stagesci1.presetName
element2=fpm
comp=Neq

#This rule raises a caution if fwfpm is in fpm & READY, and stagesci1 is not in fpm
[fwfpm-lyotsm-stagesci-fpm]
ruleType=ruleComp
priority=caution
message=fwfpm is in fpm but stagesci1 is not in focus position fpm
rule1=fwfpm-lyotsm-READY
rule2=fwfpm-lyotsm-stagesci1-fpm-neq
comp=And



#######################################
# on-sky mistakes 

[cal-src-pwr-on]
ruleType=txtVal
property=pdu0.source
element=state
target=On

[flipwfsf-in]
ruleType=swVal
property=flipwfsf.presetName
element=in
target=On


[cal-src-on-not-labmode]
ruleType=ruleComp
priority=caution
message=calibration source on (not labmode)
rule1=tcsi-not-labmode
#defined in telescope.conf
rule2=cal-src-pwr-on
comp=And


[flipwfsf-in-not-labmode]
ruleType=ruleComp
priority=caution
message=flipwfsf is in (not labmode)
rule1=tcsi-not-labmode
rule2=flipwfsf-in
comp=And

[camsci1-synchro-on]
ruleType=swVal
property=camsci1.synchro
element=toggle
target=On

[camsci2-synchro-on]
ruleType=swVal
property=camsci2.synchro
element=toggle
target=On

[camsci-synchro-on]
ruleType=ruleComp
rule1=camsci1-synchro-on
rule2=camsci2-synchro-on
comp=Or

[fxngensync-operating]
ruleType=txtVal
property=fxngensync.fsm
element=state
target=OPERATING

[fxngensync-c2-output-on]
ruleType=txtVal
property=fxngensync.C2outp
element=value
target=On

[fxngensync-not-running]
ruleType=ruleComp
rule1=fxngensync-operating
rule2=fxngensync-c2-output-on
comp=Nand

[camsci-synchro-on-fxngensync-not-running]
ruleType=ruleComp
rule1=camsci-synchro-on
rule2=fxngensync-not-running
comp=And
priority=caution
message=camsci synchro is on but fxngensync is not operating or C2 output is not on

