[stages]
qwp1 = stageqwprot1
qwp2 = stageqwprot2

[reference]                  # mechanical stage angles (deg) of the reference state
qwp1 = 157.42                # = fast-axis 90
qwp2 = 165.8                 # = fast-axis 115

[ttm]
device = ttmperi
rebaseTol = 0.01             # V; a target farther than this from every recent command counts as an external move

[calib]                      # relative to the calib directory
model = qwppupil/qwp_pupil_model.csv
cm = qwppupil/qwp_pupil_cm.fits

[telemeter]
maxInterval = 10
