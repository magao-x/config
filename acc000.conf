# accelSim configuration for acc000 on RTC
# Synchronized 8 kHz accelerometer simulation
# Artificial DM disturbance through syncopation

[sim]
zeroOutput=false
fps=8000
seed=42
modeSeed=123
leverArm=10

[optical]
#coupling=0.6
#Freqs:  11, 14, 17, 20, 25, 28, 54, 56, 58, 75, 85, 120,220,300,200weak modes
coupling=0.5,0.5,0.5,0.5,0.4,1.0,1.0,1.0,1.0,0.5,0.5,0.4,0.2,0.1,0.1
commonCoupling=1
amplitude=0
seed=7

[accelOnly]
enabled=true
frequency=40,65,80,100,150
amplitude=0.002,0.001,0.001,0.0005,0.0005
seed=11

[adc]
zero=2048
voltsPerBit=0.0083799
sensitivity=1.02

[sensor]
noisePSD=1e-8

[accel]
numChannels=2

[framegrabber]
shmimName=acc000
circBuffLength=128
threadPrio=2
cpuset=spare30

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
shmimName=camwfs_sync
referenceFps=2000
timeout=0.01
maxSlew=0.05
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

[dm]
channelName=dm01disp07_aux
modeCube=/data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/fklcombo_z10_2400_smoothed_co0.27_pb0.5_mod3_20241113_181929_1563modes/CMmodesDM/CMmodesDM.00.fits
#mask=/data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/fklcombo_z10_2400_smoothed_co0.27_pb0.5_mod3_20241113_181929_1563modes/dmmask.fits
calibration=coefficients
coefficients=-798911.751168,-315942.594932,318826.690493,-792420.649088
enabled=false
scale=0
