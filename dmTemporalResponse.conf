[wfscam]
shmimName=camwfs
threadPrio=60        # match other real-time camwfs consumers: grep threadPrio /opt/MagAOX/config/*.conf

[dm]
index=0
channel=7

[poke]
mode=actuator
x=5
y=8
amp=0.2             # small; maxCommand=1 caps it
nDelays=20
nFrames=20
nTrials=20
trialTimeout=2

[analysis]
nRef=20
nSettle=10

[t2w]
wooferModesFile=/tmp/wModes.fits
tweeterModesFile=/tmp/tModesOrtho.fits
