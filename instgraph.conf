presetPutName=lab,tel

[stagek]
type=stdMotion
trackingReqKey=labrules.info
trackingReqElement=teldome-open-stagepickoff-tel
trackerKey=ktrack.tracking
trackerElement=toggle

[ttmpupil]
type=fsm
fsmAction=active
targetStates=READY,OPERATING

[flipacq]
type=stdMotion
presetPutName=out,in
alwaysOn=out
noAutoOn=in


[camacq]
type=fsm
fsmAction=active
targetStates=OPERATING

[dmwoofer]
type=fsm
fsmAction=active
targetStates=OPERATING

[dmtweeter]
type=fsm
fsmAction=active
targetStates=OPERATING

[stageadc1]
