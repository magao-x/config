[power]
device=pdu2
channel=camllowfs

[camera]
serialNumber=A22J723005
default_x=1154.5
default_y=1490.5
default_w=512
default_h=512
default_bin_x=1
default_bin_y=1
fanSpeedControl=true
defaultFanSpeed=off

[pcie]
# Switch downstream port above this camera.  Leave empty (or omit) to disable PCIe hotplug.
downstreamPort=0000:42:08.0
# Seconds between hotplug attempts while the camera is missing.
retryInterval=30

[framegrabber]
cpuset=camllowfs
threadPrio=60

[shutter]
powerDevice=dcdu1
powerChannel=shllowfs
dioDevice=xt1121_2
sensorChannel=ch08
triggerChannel=ch12


