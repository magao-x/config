# counterOffload: tweeter counter-offload producer for dmSyncopation.
# Start dmSyncopation first so that dm01disp08_aux exists.
# The app starts disabled; enable with setINDI -s counterOffload.enable.toggle=On

[shmimMonitor]
# t2wOffloader's offload change as it appears on the tweeter
shmimName=aol0_tweeterOffload
cpuset=spare26
threadPrio=2

[counterOffload]
channel=dm01disp04_aux
# Raised-cosine ramp fitted to the woofer rise
rampStartUs=0
rampDurationUs=330
# 0 holds the contribution; otherwise the fraction removed after each published slot
leak=0.0025
timeOffsetUs=0
# Small gain for first qualification; raise it over INDI once the results look right
gain=1
computeLeadUs=20
threadPrio=20
cpuset=spare26

[syncopation]
timingStream=dmtweeter_synco_timing
writeLeadUs=10
