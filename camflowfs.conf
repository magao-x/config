[power]
device=pdu2
channel=camflowfs

[camera]
serialNumber=A22J723004
default_x=1240
default_y=1458
default_w=512
default_h=512
default_bin_x=1
default_bin_y=1
fanSpeedControl=true
defaultFanSpeed=off

[pcie]
# Switch downstream port above this camera.  Leave empty (or omit) to disable PCIe hotplug.
downstreamPort=0000:42:09.0
# Seconds between hotplug attempts while the camera is missing.
retryInterval=30

[framegrabber]
cpuset=camflowfs
threadPrio=60
latencyTime=10
latencySize=100000



[shutter]
powerDevice=dcdu1
powerChannel=shlowfs
dioDevice=xt1121_2
sensorChannel=ch03
triggerChannel=ch07


