
satLevel=16383

quality=80

mask=false

[image]
key=camwfs

[dark]
key=camwfs_dark

[mask]
key=aol1_wfsmask

[indi]
ipAddress=127.0.0.1
port=7624

[camera]
name=camwfs
filterDevices=fwtelsim,stagebs,flipwfsf,fliptip

[pwfsAlignment]
name=camwfs-fit

[north]
enabled=false

[rules]
device=labrules
cautions=cal-src-on-not-labmode,flipwfsf-in-not-labmode,ho-loop-closed-not-synchro,instCool-temp-caution,instCool-flow-caution,
cautions=camwfs-on-temp-not-ready
warnings=instCool-temp-warning,camwfs-emprotect-tripped,instCool-flow-warning
alerts=instCool-temp-alert,instCool-flow-alert


[valueDisplay]
key1=strehl.star_mag.current
label1=star mag 
precision1=1
key2=strehl.seeing.current
label2=seeing
precision2=2
