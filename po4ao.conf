[shmimMonitor]
shmimName = aol1_modevalWFS
#cpuset = acqu_mvm
cpuset = spare43
threadPrio = 45

[parameters]
# PO4AO runtime-configuration schema.
config_version = 2
dataDirs = /srv/aoc/home/rlandman/data/PO4AO
engineDirs = /srv/aoc/home/rlandman/data/PO4AO
engineName = po4ao_model.trt
# auto uses the CPU sidecar when present; cpu/tensorrt force an A/B-test backend.
linear_inference_backend = auto
channel = po4ao_output

# The po4ao process creates these five output/replay streams if they do not exist.
buffer_channel = po4ao_buffer
buffer_metadata_channel = po4ao_buffer_meta
warmup_buffer_channel = po4ao_warmup_buffer
warmup_metadata_channel = po4ao_warmup_buffer_meta
iterations_per_ep = 1000
warmup_episodes = 10
replay_buffer_size = 10000
integrator_gain = 1.0
# 0 keeps proportional fallback control; 1 applies the complete learned policy.
policy_blend = 1.0
exploration_sigma_start = 0.03
exploration_sigma_end = 0.00
Nmodes = 1563
# PO4AO controls this leading modal prefix; remaining modes pass through unchanged.
Nmodes_controlled = 1000
# C++ retains this maximum so policies with shorter histories can hot-reload.
max_Nhist = 20
#exploreNoiseFile = /srv/aoc/home/rlandman/data/PO4AO/control_noise.csv
#exploreNoiseFile = /srv/aoc/home/rlandman/data/PO4AO/control_noise_powerlaw_m2_pure.csv
exploreNoiseFile = /srv/aoc/home/rlandman/data/PO4AO/control_noise_powerlaw-1.csv
control_enabled = false
max_command_abs = 0.3
cuda_device = 0
latency_deadline_us = 500
stats_period_seconds = 10.0
