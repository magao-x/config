[device]
pollInterval=5        # seconds between explicit source refreshes
staleTimeout=15       # seconds without a valid refresh before invalidation

[outlet1]
device=dcdu1
channel=fwtelsim

[outlet2]
device=usbdu0
channel=fwtelsim

[fwtelsim]
outlets=1,2
onOrder=0,1
offOrder=1,0

[outlet3]
device=dcdu1
channel=fwscind

[outlet4]
device=usbdu1
channel=fwscind

[fwscind]
outlets=3,4
onOrder=0,1
offOrder=1,0

[outlet5]
device=pdu3
channel=flippers

[outlet6]
device=usbdu0
channel=flipacq

[outlet7]
device=usbdu0
channel=fliptip

[outlet8]
device=usbdu0
channel=flipwfsf

[flippers]
outlets=5,6,7,8
onOrder=0,1,2,3
offOrder=3,2,1,0
onDelays=0,2000,0,0
offDelays=0,0,0,2000

[outlet9]
device=pdu2
channel=stagepolrot

[outlet10]
device=usbdu1
channel=stagepolrot

[stagepolrot]
