onOrder=0,1
offOrder=1,0
onDelays=0,2000
offDelays=0,2000

[outlet11]
device=pdu2
channel=stageqwprot

[outlet12]
device=usbdu1
channel=stageqwprot

[stageqwprot]
outlets=11,12
onOrder=0,1
offOrder=1,0
onDelays=0,2000
offDelays=0,2000



