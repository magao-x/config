[power]
device=pdu2
channel=camsci2
powerOnWait=5

[camera]
serialNumber=09434417
startupTemp=-55
fanSpeedControl=true
defaultFanSpeed=off

[framegrabber]
circBuffLength=1
#defaultFlip=flipLR
cpuset=camsci2

[shutter]
powerDevice=dcdu1
powerChannel=shsci2
dioDevice=xt1121_2
sensorChannel=ch00
triggerChannel=ch04

[synchro]
deviceName=fxngensync
channel=C2
otherCamName=camsci1

[focus]
stateProperty=labrules.caution
stateElement=camsci2-on-not-focused

[focus.gotoFocus]
numSwitches=3
property1=stagebs.presetName
property2=fwfpm.filterName
property3=stagescibs.presetName
format="{}-{}-{}"
targetProperty=stagesci2.presetName

