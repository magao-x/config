[camera]
device=camwfs
shmimName=camwfs
clock=realtime
quantizationUs=1

[dm]
device=dmtweeter
shmimName=dmtweeter_sdk_start

[loop]
device=holoop

[monitor]
maxFPS=3600
pollSleepUs=10
windowSec=2
capacity=32768
clockBracketUs=1
clockMaxAgeMs=100
threadPrio=0
cpuset=

[synco]
device=dmtweeter-synco
mainStream=dmtweeter_synco_main_timing
sdkStream=dmtweeter_sdk_events
