# qwptrack.conf: dual QWP rotation tracker
[qwp1]
devName=stageqwprot1   # elliptecCtrl instance for QWP1
zero=67.42                # stage angle (deg) where the QWP1 fast axis is at 0
sign=1                 # +1 or -1: direction of fast-axis rotation vs. stage rotation

[qwp2]
devName=stageqwprot2
zero=280.80
sign=-1

[k]
devName=stagek         # K-mirror stage; position.current is the tracking input

[telemeter]
maxInterval=10         # max seconds between telem_qwptrack records
