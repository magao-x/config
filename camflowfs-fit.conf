[shmimMonitor]
shmimName=camflowfs
cpuset=camflowfs_fit
threadPrio=1

[darkShmim]
shmimName=camflowfs_dark

[refShmim]
shmimName=aol2_wfsref

[framegrabber]
shmimName=camflowfs_fit
cpuset=camflowfs_fit
threadPrio=2
latencyTime=10
latencySize=100000

[fitter]
fpsDevice=camflowfs
fpsProperty=fg_timing
fpsElement=write_fps
fpsTol=5 #make big to avoid bouncing
shutterDevice=camflowfs
