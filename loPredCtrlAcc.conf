# Operational loPredCtrlAcc configuration
# Learning, prediction, and exploration start OFF.

loopPause = 100000000

[parameters]
gain = 0.1
regularization = 100.0
gamma = 1.0
covariance = 1e-5
history = 15
future = 3
num_modes = 2
qrd = true
accel_history = 15
modal_index0 = 0
modal_index1 = 1
input_timeout = 0.01

[shmimMonitor]
shmimName = aol1_modevalWFS
threadPrio = 2
cpuset = spare28
getExistingFirst = false

[dm]
channelName = dm01disp05_aux
threadPrio = 20
cpuset = spare29
modeCube = /data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/fklcombo_z10_2400_smoothed_co0.27_pb0.5_mod3_20241113_181929_1563modes/CMmodesDM/CMmodesDM.00.fits
#mask=/data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/fklcombo_z10_2400_smoothed_co0.27_pb0.5_mod3_20241113_181929_1563modes/dmmask.fits
calibration =

[syncopation]
timingStream = dmtweeter_synco_timing
writeLeadUs = 125

[adc]
enabled = true
shmimName = acc000
profile = accelSim12
min_code = 0
max_code = 4095
reject_rails = true

capacity = 4096
max_age_us = 20000
max_interval_us = 1000
clock_tolerance_us = 1000

zero0 = 2048
zero1 = 2048
volts_per_count0 = 0.0083799
volts_per_count1 = 0.0083799
sensitivity0 = 1.02
sensitivity1 = 1.02
polarity0 = 1
polarity1 = 1

sync_device = acc000
sync_property = timingDiag
