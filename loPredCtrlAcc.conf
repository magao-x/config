# Operational loPredCtrlAcc configuration
# Learning, prediction, and exploration start OFF.

loopPause = 100000000

[parameters]
gain = 0.3
regularization = 100.0
gamma = 1.0
covariance = 1e-5
history = 15
future = 3
num_modes = 2
qrd = true
accel_history = 20
modal_index0 = 0
modal_index1 = 1
input_timeout = 0.01

[integrator]
# When true, each DDSPC command is integrated with the main loop's mfilt law, s = mult*s - g$
# +/-limit, before synco writes s to dm.channelName. gain, mult and limit are always the mai$
# change: [loop] device's loop_gain, loop_multcoeff and loop_max_limit times this mode's aol$
# aolN_mmultfact and aolN_mlimitfact. Standard mode integrates once per WFS frame; assisted $
# gain/dm_slots. Both fits are trained on the deltas. Prediction is refused until all six ha$
# main loop's tip/tilt gain must be nonzero. true is the default; false applies DDSPC comman$
# See agents/plans/2026-11/ddspc-standard-integrator.md.
enabled = true

[loop]
# Main loop's cacaoInterface INDI device, and the cacao loop number N of the aolN_m*fact streams.
device = holoop
number = 1

[shmimMonitor]
shmimName = aol1_modevalWFS
threadPrio = 2
cpuset = spare28
getExistingFirst = false

[framegrabber]
shmimName=aol1_modevalPRC
cpuset=acqu_mvm
threadPrio=45

[dm]
channelName = dm01disp05_aux
threadPrio = 20
cpuset = spare29
modeCube = /data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/default/CMmodesDM/CMmodesDM.00.fits
#mask=/data/cacao/tweeter-vispyr/tweeter-vispyr-calibs/fklcombo_z10_2400_smoothed_co0.27_pb0.5_mod3_20241113_181929_1563modes/dmmask.fits
calibration =

[syncopation]
timingStream = dmtweeter_synco_timing
writeLeadUs = 125

[adc]
enabled = true
shmimName = acc000
profile = accelSim12
min_code = 0
max_code = 4095
reject_rails = true

capacity = 4096
max_age_us = 20000
max_interval_us = 1000
clock_tolerance_us = 1000

zero0 = 2048
zero1 = 2048
volts_per_count0 = 0.0083799
volts_per_count1 = 0.0083799
sensitivity0 = 1.02
sensitivity1 = 1.02
polarity0 = 1
polarity1 = 1

sync_device = acc000
sync_property = timingDiag
